<!DOCTYPE html>
<!-- © הזכויות שמורות ל-MP מיכאל פפיסמדוב 2001 -->
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיקת לוגו — The Yacht</title>
  <style>
    body {
      margin: 0;
      font-family: Heebo, Arial, sans-serif;
      background: #102229;
      color: #fff;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.2rem; }
    p { margin: 0 0 20px; opacity: 0.8; }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .box {
      border-radius: 14px;
      padding: 18px;
      text-align: center;
    }
    .box strong { display: block; margin-bottom: 12px; font-size: 0.9rem; }
    .dark { background: #071820; }
    .brand { background: #0b3a4a; }
    .light { background: #f5f8fa; color: #102229; }
    .photo {
      background:
        linear-gradient(160deg, rgba(11,58,74,.75), rgba(7,24,32,.85)),
        #1a6b7c;
    }
    img {
      max-width: 100%;
      height: auto;
      image-rendering: auto;
    }
    .meta { margin-top: 18px; font-size: 0.85rem; opacity: 0.75; }
  </style>
</head>
<body>
  <h1>בדיקת לוגו מהירה</h1>
  <p>קובץ: <code>static/IMG/LOGO.png</code> · רענון קשיח אם לא רואים עדכון</p>
  <div class="grid">
    <div class="box dark">
      <strong>רקע כהה (כניסה)</strong>
      <img src="static/IMG/LOGO.png?v=check" alt="לוגו" width="200">
    </div>
    <div class="box brand">
      <strong>צבע מותג</strong>
      <img src="static/IMG/LOGO.png?v=check" alt="לוגו" width="180">
    </div>
    <div class="box light">
      <strong>רקע בהיר (כרטיסים)</strong>
      <img src="static/IMG/LOGO.png?v=check" alt="לוגו" width="160">
    </div>
    <div class="box photo">
      <strong>גודל כותרת (140px)</strong>
      <img src="static/IMG/LOGO.png?v=check" alt="לוגו" width="140">
    </div>
  </div>
  <p class="meta" id="meta">טוען מידע…</p>
  <script>
    const img = new Image();
    img.onload = function () {
      document.getElementById("meta").textContent =
        "מידות: " + img.naturalWidth + "×" + img.naturalHeight + " פיקסלים";
    };
    img.onerror = function () {
      document.getElementById("meta").textContent = "לא נמצא הקובץ static/IMG/LOGO.png";
    };
    img.src = "static/IMG/LOGO.png?v=check";
  </script>
</body>
</html>
